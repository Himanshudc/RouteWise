name: Check RouteWise
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: routewise_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: routewise_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U routewise_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend_go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend_go/go.sum
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://routewise_test:test_password@localhost:5432/routewise_test?sslmode=disable
      - run: go vet ./...
      - run: go build ./cmd/server
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
